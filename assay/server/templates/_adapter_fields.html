{% from "_macros.html" import model_selector %}

<!-- Adapter selector -->
<div style="margin-bottom:.75rem">
  <label style="display:block;font-size:13px;font-weight:500;margin-bottom:.3rem">Adapter</label>
  <select x-model="adapter" style="width:100%;max-width:18rem">
    <option value="anthropic">anthropic</option>
    <option value="openai_compat">OpenAI-compatible</option>
    <option value="ollama">ollama (local)</option>
    <option value="rest">REST / HTTP</option>
  </select>
</div>

<!-- Base URL (openai_compat, ollama, rest) -->
<div x-show="['openai_compat','ollama','rest'].includes(adapter)"
     style="margin-top:.5rem">
  <label style="display:block;font-size:13px;font-weight:500;margin-bottom:.3rem">Base URL</label>
  <input x-model="endpoint" type="text"
    :placeholder="adapter === 'ollama' ? 'http://localhost:11434' : adapter === 'openai_compat' ? 'https://api.openai.com/v1' : 'https://api.example.com'"
    style="width:100%">
</div>

<!-- API key env var (anthropic, openai_compat, rest) -->
<div x-show="['anthropic','openai_compat','rest'].includes(adapter)"
     style="margin-top:.5rem">
  <label style="display:block;font-size:13px;font-weight:500;margin-bottom:.3rem">API key env var</label>
  <input x-model="key_env" type="text"
    :placeholder="adapter === 'anthropic' ? 'ANTHROPIC_API_KEY' : 'OPENAI_API_KEY'"
    style="width:100%">
</div>

<!-- Model selector (anthropic, openai_compat, ollama) -->
<div x-show="['anthropic','openai_compat','ollama'].includes(adapter)"
     style="margin-top:.5rem">
  <label style="display:block;font-size:13px;font-weight:500;margin-bottom:.3rem">Model</label>
  {{ model_selector('model', 'adapter') }}
</div>

<!-- Interface file: what grounds the generated case inputs in real request fields -->
<div style="margin-top:.5rem">
  <label style="display:block;font-size:13px;font-weight:500;margin-bottom:.3rem">
    Interface file <span style="font-weight:400;color:var(--text-muted)">(optional)</span>
  </label>
  <input x-model="interfaceFile" type="text" id="interface-file"
         placeholder="./collections/api.postman_collection.json"
         style="width:100%">
  <p style="font-size:12px;color:var(--text-muted);margin:.3rem 0 0">
    <i class="ti ti-file-code" aria-hidden="true"></i>
    Path (on the server) to a Postman, OpenAPI or MCP description. Without one Assay
    cannot know your request fields, so generated test inputs fall back to a single
    <code>prompt</code> field.
  </p>
</div>
